<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--np-bg);font-family:var(--np-font-body);color:var(--np-fg-1)}
.row{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.k{font-family:var(--np-font-mono);font-size:10px;color:var(--np-fg-3);width:90px}
.b{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px}
svg{width:13px;height:13px;fill:currentColor}
</style></head><body>
<div class="row"><div class="k">genre</div>
  <span class="b" style="background:#ff2c55;color:#fff">Hành Động</span>
  <span class="b" style="background:#ff2c55;color:#fff">Khoa Học Viễn Tưởng</span>
  <span class="b" style="background:rgba(255,44,85,.7);color:#fff;backdrop-filter:blur(8px)">Phiêu Lưu</span>
</div>
<div class="row"><div class="k">rating</div>
  <span class="b" style="background:rgba(0,0,0,.7);color:#ffc83a"><svg viewBox="0 0 20 20"><path d="M9.05 2.93c.3-.92 1.6-.92 1.9 0l1.07 3.3a1 1 0 0 0 .95.68h3.46c.97 0 1.37 1.24.59 1.81l-2.8 2.03a1 1 0 0 0-.36 1.12l1.07 3.29c.3.92-.76 1.69-1.54 1.12L10 14.25l-2.8 2.03c-.78.57-1.84-.2-1.54-1.12l1.07-3.29a1 1 0 0 0-.36-1.12L3.57 8.72c-.78-.57-.38-1.81.59-1.81H7.6a1 1 0 0 0 .95-.68z"/></svg>8.4</span>
  <span class="b" style="background:rgba(255,200,58,.14);color:#ffc83a;border:1px solid rgba(255,200,58,.4)">IMDb 8.4</span>
</div>
<div class="row"><div class="k">quality</div>
  <span class="b" style="background:#ff8a00;color:#fff;border-radius:4px;font-size:11px;letter-spacing:.05em">4K</span>
  <span class="b" style="background:#2ad4ff;color:#03222b;border-radius:4px;font-size:11px;letter-spacing:.05em">FHD</span>
  <span class="b" style="background:#6b7385;color:#fff;border-radius:4px;font-size:11px;letter-spacing:.05em">HD</span>
  <span class="b" style="background:#ff4d4f;color:#fff;border-radius:4px;font-size:11px;letter-spacing:.05em">CAM</span>
  <span class="b" style="background:rgba(46,204,113,.16);color:#2ecc71;border:1px solid rgba(46,204,113,.4);border-radius:4px;font-size:11px">Vietsub</span>
</div>
<div class="row"><div class="k">status</div>
  <span class="b" style="background:rgba(255,44,85,.16);color:#ff4d6f;border:1px solid rgba(255,44,85,.4)">HOT</span>
  <span class="b" style="background:rgba(255,176,32,.16);color:#ffb020">Sắp chiếu</span>
  <span class="b" style="background:rgba(91,141,239,.16);color:#5b8def">Tập mới</span>
</div>
</body></html>
