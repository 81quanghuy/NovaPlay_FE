<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:18px;background:var(--np-bg);color:var(--np-fg-1);font-family:var(--np-font-body)}
.row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;align-items:end}
.cell{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{width:72px;height:72px;background:#181d2a;border:1px solid rgba(255,255,255,.10)}
.k{font-family:var(--np-font-mono);font-size:10px;color:var(--np-fg-3)}
.px{font-size:11px;font-weight:600}
</style></head><body>
<div class="row">
  <div class="cell"><div class="box" style="border-radius:4px"></div><div class="px">4</div><div class="k">xs</div></div>
  <div class="cell"><div class="box" style="border-radius:6px"></div><div class="px">6</div><div class="k">sm</div></div>
  <div class="cell"><div class="box" style="border-radius:10px"></div><div class="px">10</div><div class="k">md</div></div>
  <div class="cell"><div class="box" style="border-radius:14px"></div><div class="px">14</div><div class="k">lg</div></div>
  <div class="cell"><div class="box" style="border-radius:20px;border-color:#ff2c55"></div><div class="px">20</div><div class="k">xl · poster</div></div>
  <div class="cell"><div class="box" style="border-radius:28px"></div><div class="px">28</div><div class="k">2xl</div></div>
  <div class="cell"><div class="box" style="border-radius:999px"></div><div class="px">999</div><div class="k">pill</div></div>
</div>
</body></html>
