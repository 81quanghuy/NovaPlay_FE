<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--np-bg);font-family:var(--np-font-body);color:var(--np-fg-1)}
.row{margin-bottom:14px}
label{display:block;font-size:12px;color:var(--np-fg-2);margin-bottom:6px;font-weight:500}
.input{width:100%;padding:11px 14px 11px 40px;background:#181d2a;border:1px solid rgba(255,255,255,.08);border-radius:10px;color:#fff;font-family:inherit;font-size:14px;outline:none;transition:.2s;box-sizing:border-box}
.input:focus{border-color:#ff2c55;background:#1f2532}
.field{position:relative}
.field svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#6b7385;fill:none;stroke-width:2}
.simple{padding-left:14px}
</style></head><body>
<div class="row">
  <label>Tìm kiếm</label>
  <div class="field">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    <input class="input" placeholder="Tìm kiếm phim, diễn viên..." value="Spider-Man" />
  </div>
</div>
<div class="row">
  <label>Email</label>
  <input class="input simple" placeholder="you@email.com" />
</div>
<div class="row">
  <label>Mật khẩu</label>
  <input class="input simple" type="password" value="••••••••" />
</div>
</body></html>
