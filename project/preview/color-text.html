<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:var(--np-bg);font-family:var(--np-font-body);color:var(--np-fg-1)}
.row{display:flex;flex-direction:column;gap:8px}
.lin{display:flex;align-items:center;gap:14px;padding:10px 14px;background:var(--np-surface);border-radius:10px}
.sw{width:36px;height:36px;border-radius:8px;flex-shrink:0;border:1px solid rgba(255,255,255,.06)}
.label{font-weight:600;font-size:13px;flex:1}
.hex{font-family:var(--np-font-mono);font-size:11px;color:var(--np-fg-2)}
.role{font-size:11px;color:var(--np-fg-3)}
</style></head><body>
<div class="row">
  <div class="lin"><div class="sw" style="background:#ffffff"></div><div class="label" style="color:#fff">fg</div><div class="role">headlines, hero title</div><div class="hex">#FFFFFF</div></div>
  <div class="lin"><div class="sw" style="background:#e8ecf3"></div><div class="label" style="color:#e8ecf3">fg-1</div><div class="role">body text</div><div class="hex">#E8ECF3</div></div>
  <div class="lin"><div class="sw" style="background:#a8b0c0"></div><div class="label" style="color:#a8b0c0">fg-2</div><div class="role">meta, secondary</div><div class="hex">#A8B0C0</div></div>
  <div class="lin"><div class="sw" style="background:#6b7385"></div><div class="label" style="color:#6b7385">fg-3</div><div class="role">muted, caption</div><div class="hex">#6B7385</div></div>
  <div class="lin"><div class="sw" style="background:#444a59"></div><div class="label" style="color:#444a59">fg-disabled</div><div class="role">disabled</div><div class="hex">#444A59</div></div>
</div>
</body></html>
