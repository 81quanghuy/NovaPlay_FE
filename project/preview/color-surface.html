<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:24px;background:#101319;font-family:var(--np-font-body);color:var(--np-fg-1)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{aspect-ratio:1/1;border-radius:12px;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;border:1px solid rgba(255,255,255,.08)}
.name{font-size:11px;font-weight:600;color:#fff}
.hex{font-family:var(--np-font-mono);font-size:10px;color:#a8b0c0;margin-top:2px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#07090f"><div class="name">bg</div><div class="hex">#07090F</div></div>
  <div class="sw" style="background:#0b0f17"><div class="name">bg-2</div><div class="hex">#0B0F17</div></div>
  <div class="sw" style="background:#11151f"><div class="name">surface</div><div class="hex">#11151F</div></div>
  <div class="sw" style="background:#181d2a"><div class="name">surface-2</div><div class="hex">#181D2A</div></div>
  <div class="sw" style="background:#222a3a"><div class="name">surface-3</div><div class="hex">#222A3A</div></div>
</div>
</body></html>
