<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:28px;background:#0b0f17;color:var(--np-fg-1);font-family:var(--np-font-body)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.box{width:80px;height:80px;border-radius:12px;background:#181d2a}
.k{font-family:var(--np-font-mono);font-size:11px;color:var(--np-fg-3)}
</style></head><body>
<div class="row">
  <div class="cell"><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,.4)"></div><div class="k">sm</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 8px 20px rgba(0,0,0,.45)"></div><div class="k">md</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 24px 48px rgba(0,0,0,.55)"></div><div class="k">lg</div></div>
  <div class="cell"><div class="box" style="box-shadow:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)"></div><div class="k">poster</div></div>
  <div class="cell"><div class="box" style="background:#ff2c55;box-shadow:0 0 32px rgba(255,44,85,.55)"></div><div class="k">glow</div></div>
</div>
</body></html>
