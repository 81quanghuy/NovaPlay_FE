<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
body{margin:0;padding:20px;background:var(--np-bg);font-family:var(--np-font-body)}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{padding:14px;border-radius:12px;color:#fff}
.name{font-weight:700;font-size:13px}
.hex{font-family:var(--np-font-mono);font-size:11px;opacity:.8;margin-top:4px}
</style></head><body>
<div class="row">
  <div class="tile" style="background:#2ecc71"><div class="name">success</div><div class="hex">#2ECC71</div></div>
  <div class="tile" style="background:#ffb020"><div class="name" style="color:#2a1900">warning</div><div class="hex" style="color:#2a1900">#FFB020</div></div>
  <div class="tile" style="background:#ff4d4f"><div class="name">danger</div><div class="hex">#FF4D4F</div></div>
  <div class="tile" style="background:#5b8def"><div class="name">info</div><div class="hex">#5B8DEF</div></div>
  <div class="tile" style="background:#ff8a00"><div class="name">quality · 4K</div><div class="hex">#FF8A00</div></div>
  <div class="tile" style="background:#2ad4ff"><div class="name" style="color:#03222b">quality · FHD</div><div class="hex" style="color:#03222b">#2AD4FF</div></div>
  <div class="tile" style="background:#6b7385"><div class="name">quality · HD</div><div class="hex">#6B7385</div></div>
  <div class="tile" style="background:#ff4d4f"><div class="name">quality · CAM</div><div class="hex">#FF4D4F</div></div>
</div>
</body></html>
